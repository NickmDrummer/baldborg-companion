name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build renderer
        working-directory: apps/desktop
        run: npm run build

      - name: Syntax-check the Electron sources
        run: |
          for file in apps/desktop/electron/*.js; do
            node --check "$file"
          done

      - name: Run regression checks
        run: node scripts/checks.mjs
